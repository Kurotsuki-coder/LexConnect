services:
  app:
    build: .
    container_name: lexconnect-backend
    ports:
      - "8000:9000"
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: lexconnect
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

  db:
    image: postgres:16
    container_name: lexconnect-db
    restart: always
    environment:
      POSTGRES_DB: lexconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lexconnect_pgdata:/var/lib/postgresql/data

  # garde tes autres services (frontend, etc.) tels quels

volumes:
  lexconnect_pgdata: