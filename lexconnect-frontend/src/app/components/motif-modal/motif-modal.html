<div class="overlay" *ngIf="visible" (click)="onCancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>{{ title }}</h3>
    <p class="hint">Ce motif sera visible par l'utilisateur concerné.</p>

    <textarea
      [(ngModel)]="motif"
      name="motif"
      rows="4"
      placeholder="Explique la raison de cette action..."
    ></textarea>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <div class="actions">
      <button class="btn-cancel" (click)="onCancel()">Annuler</button>
      <button class="btn-confirm" [class.danger]="dangerAction" (click)="onConfirm()">{{ actionLabel }}</button>
    </div>
  </div>
</div>
